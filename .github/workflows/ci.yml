name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint runner image
        run: docker run --rm --volume "$GITHUB_WORKSPACE/image:/work:ro" docker.io/hadolint/hadolint@sha256:9259e253a4e299b50c92006149dd3a171c7ea3c5bd36f060022b5d2c1ff0fbbe hadolint --failure-threshold error /work/Dockerfile
      - name: Check shell scripts
        run: shellcheck image/entrypoint.sh image/job-cleanup.sh scripts/runnerctl scripts/docker-supervisor.sh tests/run.sh
      - run: ./tests/run.sh
      - name: Validate preset syntax
        run: python3 -m pip install --break-system-packages pyyaml && python3 -c 'import json,yaml; yaml.safe_load(open("services/github-actions-runner.yaml")); json.load(open("services/index.json"))'
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: image
          push: false
