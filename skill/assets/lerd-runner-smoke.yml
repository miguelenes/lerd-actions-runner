name: Lerd runner smoke
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lerd-runner-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docker:
    runs-on: [self-hosted, linux, x64, lerd-RUNNER_LABEL]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check private Docker daemon, localhost publishing, and bind mounts
        run: |
          docker info
          docker network create lerd-smoke-net
          docker volume create lerd-smoke-volume
          docker run --detach --name lerd-smoke-web --network lerd-smoke-net \
            --volume lerd-smoke-volume:/smoke \
            -p 127.0.0.1:18765:80 nginx:1.27-alpine
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18765 >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            docker inspect lerd-smoke-web --format '{{json .State}}' || true
            docker logs lerd-smoke-web || true
            exit 1
          fi
          docker inspect lerd-smoke-web --format '{{.State.Running}}' | grep -qx true
          printf 'bind mount passed\n' >"$RUNNER_TEMP/lerd-runner-bind.txt"
          docker run --rm --volume "$RUNNER_TEMP:/lerd-host-temp:ro" alpine:3.21 \
            grep -qx 'bind mount passed' /lerd-host-temp/lerd-runner-bind.txt
          mkdir -p "$RUNNER_TOOL_CACHE/lerd-smoke"
          printf 'tool cache survived job cleanup\n' >"$RUNNER_TOOL_CACHE/lerd-smoke/marker"
          printf 'private Docker and bind mount job passed\n' >"$RUNNER_TEMP/lerd-runner-smoke.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lerd-runner-smoke
          path: |
            ${{ runner.temp }}/lerd-runner-smoke.txt
            ${{ runner.temp }}/lerd-runner-bind.txt
  cleanup-after-docker:
    needs: docker
    runs-on: [self-hosted, linux, x64, lerd-RUNNER_LABEL]
    timeout-minutes: 10
    steps:
      - name: Confirm per-job cleanup and persistent tool cache
        run: |
          test -z "$(docker ps --quiet --all)"
          test -z "$(docker network ls --quiet --filter type=custom)"
          test -z "$(docker volume ls --quiet)"
          test -s "$RUNNER_TOOL_CACHE/lerd-smoke/marker"
          rm -rf "$RUNNER_TOOL_CACHE/lerd-smoke"
  services-and-container:
    needs: cleanup-after-docker
    runs-on: [self-hosted, linux, x64, lerd-RUNNER_LABEL]
    timeout-minutes: 15
    container: alpine:3.21
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check localhost workflow service and container job
        run: |
          apk add --no-cache redis
          redis-cli -h localhost -p 16379 ping | grep -qx PONG
          redis-cli -h redis ping | grep -qx PONG
          printf 'container job with workflow service passed\n' > result.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lerd-container-service-smoke
          path: result.txt
